
name: Gerar cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Gerar animação
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%2300FF00&color_dots=%23FFCCCC,%23FF9999,%23FF6666,%23FF3333,%23FF0000
            dist/snake-dark.svg?palette=github-dark&color_snake=%2300FF00&color_dots=%23FFCCCC,%23FF9999,%23FF6666,%23FF3333,%23FF0000

      - name: Publicar animação
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
